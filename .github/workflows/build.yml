name: Build OpenSK nRF52840 SuperMini UF2

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OpenSK -> nRF52840 UF2
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: "1"

      # Adafruit nRF52840 UF2 family
      UF2_FAMILY: "0xada52840"

      # Application start address
      UF2_BASE: "0x26000"

    steps:

      # ============================================================
      # 1. CHECKOUT OPENSK + WASEFIRE SUBMODULE
      # ============================================================

      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 2. SHOW REPOSITORY / SUBMODULE STATE
      #
      # IMPORTANT:
      # Do NOT use:
      #
      #   git -C third_party/wasefire rev-parse HEAD
      #
      # because Wasefire is a submodule and its checkout state
      # is already controlled by the parent repository.
      # ============================================================

      - name: Verify repository and Wasefire
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "OpenSK repository"
          echo "============================================================"

          git rev-parse HEAD

          echo
          echo "============================================================"
          echo "Git submodules"
          echo "============================================================"

          git submodule status || true

          echo
          echo "============================================================"
          echo "Wasefire directory"
          echo "============================================================"

          if [ ! -d third_party/wasefire ]; then
            echo "ERROR: third_party/wasefire does not exist."
            exit 1
          fi

          if [ ! -f third_party/wasefire/Cargo.toml ]; then
            echo "ERROR: third_party/wasefire/Cargo.toml does not exist."
            echo
            echo "Directory contents:"
            find third_party/wasefire -maxdepth 2 -type f | head -100 || true
            exit 1
          fi

          echo "Wasefire directory: OK"
          echo "Wasefire Cargo.toml: OK"

          echo
          echo "============================================================"
          echo "Wasefire Cargo.toml"
          echo "============================================================"

          sed -n '1,80p' third_party/wasefire/Cargo.toml

      # ============================================================
      # 3. INSTALL NATIVE BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            pkg-config \
            libssl-dev \
            libudev-dev \
            python3 \
            python3-pip \
            curl \
            git

      # ============================================================
      # 4. INSTALL THE TOOLCHAIN SPECIFIED BY OPENSK
      #
      # rust-toolchain.toml in this repository currently says:
      #
      # nightly-2026-06-03
      #
      # with:
      #
      # thumbv7em-none-eabi
      #
      # DO NOT override this with another nightly date.
      # ============================================================

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Repository Rust toolchain"
          echo "============================================================"

          cat rust-toolchain.toml

          echo
          echo "Installing toolchain from rust-toolchain.toml..."

          rustup show active-toolchain

          rustup target add thumbv7em-none-eabi

          echo
          echo "============================================================"
          echo "Rust versions"
          echo "============================================================"

          rustc --version
          cargo --version
          rustup --version

          echo
          echo "============================================================"
          echo "Installed targets"
          echo "============================================================"

          rustup target list --installed

      # ============================================================
      # 5. VERIFY REQUIRED RUST TARGET
      # ============================================================

      - name: Verify ARM target
        shell: bash
        run: |
          set -euo pipefail

          rustup target list --installed \
            | grep -Fx "thumbv7em-none-eabi"

          echo "thumbv7em-none-eabi: OK"

      # ============================================================
      # 6. INSTALL / SET UP WASEFIRE
      #
      # OpenSK is built as a native Wasefire applet.
      #
      # cargo build on OpenSK alone produces:
      #
      #   libopensk_wasefire.rlib
      #
      # That is NOT the final firmware.
      # ============================================================

      - name: Setup Wasefire
        shell: bash
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail

          if [ -f scripts/setup.sh ]; then
            chmod +x scripts/setup.sh
            ./scripts/setup.sh -y
          else
            echo "No Wasefire scripts/setup.sh found."
            echo "Continuing because required Rust/native dependencies"
            echo "are already installed by the workflow."
          fi

      # ============================================================
      # 7. SHOW WASEFIRE BUILD SYSTEM
      # ============================================================

      - name: Inspect Wasefire xtask
        shell: bash
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Wasefire directory"
          echo "============================================================"

          pwd

          echo
          echo "============================================================"
          echo "Wasefire Cargo packages"
          echo "==========================================================="

          cargo metadata \
            --no-deps \
            --format-version 1 \
            > /tmp/wasefire-metadata.json

          python3 - <<'PY'
          import json

          with open("/tmp/wasefire-metadata.json", "r") as f:
              data = json.load(f)

          for package in data.get("packages", []):
              print(
                  package["name"],
                  package["version"]
              )
          PY

      # ============================================================
      # 8. PATCH MEMORY LAYOUT FOR ADAFRUIT UF2
      #
      # Application begins at:
      #
      #   0x26000
      #
      # This is specifically for the requested Adafruit UF2
      # bootloader layout.
      #
      # NOTE:
      # We preserve the original file so the build directory
      # remains easy to inspect.
      # ============================================================

      - name: Configure nRF52840 UF2 memory layout
        shell: bash
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail

          LINKER="crates/runner-nordic/board-dongle.x"

          if [ ! -f "$LINKER" ]; then
            echo "ERROR: Wasefire linker script not found:"
            echo "$LINKER"
            echo
            echo "Searching for Nordic linker files:"
            find crates -type f \
              \( -name '*.x' -o -name 'memory.x' \) \
              -print | sort
            exit 1
          fi

          cp "$LINKER" "${LINKER}.original"

          cat > "$LINKER" <<'EOF'
          /*
           * OpenSK / Wasefire
           *
           * nRF52840 Adafruit UF2 layout
           *
           * Application base:
           *
           *     0x26000
           *
           * RAM:
           *
           *     0x20000008 .. 0x20040000
           *
           */

          _rstack = 0x20000008;
          _rheap  = 0x20008000;
          _rlimit = 0x20040000;

          /*
           * Flash layout
           *
           * 0x00000 - 0x25FFF
           *     bootloader / reserved
           *
           * 0x26000
           *     Wasefire platform
           *
           * 0x98000
           *     OpenSK applet
           *
           * 0xDA000
           *     Wasefire storage
           *
           * 0xED000
           *     reserved
           */

          _platform = 0x00026000;
          _applet   = 0x00098000;
          _store    = 0x000DA000;
          _limit    = 0x000ED000;
          EOF

          echo "============================================================"
          echo "Patched linker script"
          echo "============================================================"

          cat "$LINKER"

      # ============================================================
      # 9. BUILD THE REAL FIRMWARE
      #
      # IMPORTANT:
      #
      # DO NOT run:
      #
      # cargo build --release --target thumbv7em-none-eabihf
      #
      # That builds the OpenSK library/applet and results in:
      #
      # libopensk_wasefire.rlib
      #
      # Instead Wasefire xtask builds the native applet and links
      # it into runner-nordic.
      # ============================================================

      - name: Build OpenSK Wasefire Nordic firmware
        shell: bash
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building OpenSK Wasefire applet"
          echo "============================================================"

          cargo xtask \
            --release \
            --native \
            applet rust ../.. \
            --opt-level=z \
            --features=ctap1,config-command \
            runner nordic \
              --board=dongle \
              --single-sided \
              --opt-level=z \
              --features=usb-ctap \
              --features=software-crypto-aes256-cbc \
              --features=software-crypto-hmac-sha256 \
              --features=software-crypto-p256-ecdh \
              --features=software-crypto-p256-ecdsa

      # ============================================================
      # 10. DEBUG ALL BUILD OUTPUTS
      # ============================================================

      - name: Inspect build outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Searching target directories"
          echo "============================================================"

          for dir in \
            target \
            third_party/wasefire/target
          do
            if [ -d "$dir" ]; then
              echo
              echo "----- $dir -----"

              find "$dir" \
                -type f \
                \( \
                  -name 'runner-nordic' \
                  -o -name 'runner-nordic.elf' \
                  -o -name '*.elf' \
                  -o -name '*.hex' \
                  -o -name '*.bin' \
                  -o -name '*.rlib' \
                \) \
                -print \
                | sort \
                | head -300
            fi
          done

      # ============================================================
      # 11. LOCATE FINAL RUNNER ELF
      #
      # Prefer:
      #
      # third_party/wasefire/target/
      #   thumbv7em-none-eabi/
      #     release/
      #       runner-nordic
      #
      # but search all possible target directories.
      # ============================================================

      - name: Locate final ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Searching for runner-nordic ELF"
          echo "============================================================"

          SEARCH_ROOTS=()

          if [ -d "third_party/wasefire/target" ]; then
            SEARCH_ROOTS+=("third_party/wasefire/target")
          fi

          if [ -d "target" ]; then
            SEARCH_ROOTS+=("target")
          fi

          if [ "${#SEARCH_ROOTS[@]}" -eq 0 ]; then
            echo "ERROR: No target directory exists."
            exit 1
          fi

          mapfile -t ELF_FILES < <(
            find "${SEARCH_ROOTS[@]}" \
              -type f \
              \( \
                -name 'runner-nordic' \
                -o -name 'runner-nordic.elf' \
              \) \
              -print \
              2>/dev/null \
              | sort -u
          )

          echo
          echo "ELF candidates:"
          printf '%s\n' "${ELF_FILES[@]:-<none>}"

          if [ "${#ELF_FILES[@]}" -eq 0 ]; then
            echo
            echo "ERROR: runner-nordic ELF was not generated."
            echo
            echo "All executable-looking files:"
            find "${SEARCH_ROOTS[@]}" \
              -type f \
              \( \
                -perm -111 \
                -o -name '*.elf' \
                -o -name 'runner-*' \
              \) \
              -print \
              2>/dev/null \
              | sort \
              | head -300

            echo
            echo "This means the Wasefire runner build itself failed"
            echo "or this version of Wasefire uses another output name."
            exit 1
          fi

          ELF=""

          for candidate in "${ELF_FILES[@]}"; do
            if [[ "$candidate" == *"/thumbv7em-none-eabi/release/runner-nordic" ]]; then
              ELF="$candidate"
              break
            fi
          done

          if [ -z "$ELF" ]; then
            ELF="${ELF_FILES[0]}"
          fi

          echo
          echo "============================================================"
          echo "FINAL ELF"
          echo "============================================================"

          echo "$ELF"

          test -f "$ELF"

          echo "OPENSK_ELF=$ELF" >> "$GITHUB_ENV"

      # ============================================================
      # 12. VERIFY ELF
      # ============================================================

      - name: Validate final ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "ELF"
          echo "============================================================"

          file "$OPENSK_ELF"

          echo
          echo "============================================================"
          echo "ELF HEADER"
          echo "============================================================"

          arm-none-eabi-readelf \
            -h \
            "$OPENSK_ELF"

          echo
          echo "============================================================"
          echo "ELF SECTIONS"
          echo "============================================================"

          arm-none-eabi-readelf \
            -S \
            "$OPENSK_ELF"

          echo
          echo "============================================================"
          echo "ELF PROGRAM HEADERS"
          echo "============================================================"

          arm-none-eabi-readelf \
            -l \
            "$OPENSK_ELF"

          echo
          echo "============================================================"
          echo "ENTRY POINT"
          echo "============================================================"

          arm-none-eabi-readelf \
            -h \
            "$OPENSK_ELF" \
            | grep -E \
              'Class:|Data:|Machine:|Entry point address:'

      # ============================================================
      # 13. ELF -> HEX + BIN
      # ============================================================

      - name: Convert ELF to HEX and BIN
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          echo "============================================================"
          echo "ELF -> HEX"
          echo "============================================================"

          arm-none-eabi-objcopy \
            -O ihex \
            "$OPENSK_ELF" \
            artifacts/opensk_nrf52840.hex

          echo
          echo "============================================================"
          echo "ELF -> BIN"
          echo "============================================================"

          arm-none-eabi-objcopy \
            -O binary \
            --gap-fill 0xff \
            "$OPENSK_ELF" \
            artifacts/opensk_nrf52840.bin

          echo
          echo "Generated files:"
          ls -lh artifacts/

      # ============================================================
      # 14. GET UF2CONV
      # ============================================================

      - name: Download uf2conv.py
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py \
            -o uf2conv.py

          chmod +x uf2conv.py

          python3 uf2conv.py --help

      # ============================================================
      # 15. BIN -> UF2
      #
      # EXACT REQUEST:
      #
      #   base address = 0x26000
      #   family ID     = 0xada52840
      # ============================================================

      - name: Convert firmware to UF2
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BIN -> UF2"
          echo "============================================================"

          python3 uf2conv.py \
            artifacts/opensk_nrf52840.bin \
            -c \
            -b 0x26000 \
            -f 0xada52840 \
            -o artifacts/opensk_nrf52840_autoconfirm.uf2

          test -s \
            artifacts/opensk_nrf52840_autoconfirm.uf2

          echo
          echo "============================================================"
          echo "UF2 FILE"
          echo "============================================================"

          ls -lh \
            artifacts/opensk_nrf52840_autoconfirm.uf2

      # ============================================================
      # 16. VERIFY UF2
      # ============================================================

      - name: Validate UF2
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "UF2 INFORMATION"
          echo "============================================================"

          python3 uf2conv.py \
            artifacts/opensk_nrf52840_autoconfirm.uf2 \
            -i

          echo
          echo "============================================================"
          echo "ARTIFACTS"
          echo "============================================================"

          ls -lah artifacts/

      # ============================================================
      # 17. UPLOAD
      # ============================================================

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensk-nrf52840-supermini
          if-no-files-found: error
          path: |
            artifacts/opensk_nrf52840_autoconfirm.uf2
            artifacts/opensk_nrf52840.hex
            artifacts/opensk_nrf52840.bin
```
