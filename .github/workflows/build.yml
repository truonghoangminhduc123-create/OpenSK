name: Build OpenSK UF2 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python & Toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust Targets & Wasefire CLI
        run: |
          rustup target add thumbv7em-none-eabihf
          rustup target add wasm32-unknown-unknown
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -O uf2conv.py
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -O uf2families.json

      - name: Setup OpenSK Environment
        run: |
          ./setup.sh

      - name: Build Firmware and Package UF2
        run: |
          mkdir -p dist
          
          # 1. Biên dịch Runner/Applet OpenSK
          # Tìm file Cargo.toml của Wasefire runner cho nRF52840
          RUNNER_TOML=$(find third_party/wasefire/ -name "Cargo.toml" | grep -E "nrf52840|nordic" | head -n 1)

          if [ -n "$RUNNER_TOML" ]; then
            echo "Biên dịch với Wasefire Runner: $RUNNER_TOML"
            cargo build --release --target thumbv7em-none-eabihf --manifest-path "$RUNNER_TOML"
          else
            echo "Biên dịch toàn bộ workspace..."
            cargo build --release --target thumbv7em-none-eabihf --workspace || cargo build --release --target thumbv7em-none-eabihf
          fi

          # 2. Tìm file ELF executable thực tế
          ELF_FILE=$(find target/thumbv7em-none-eabihf/release/ -maxdepth 2 -type f -executable ! -name "*.so" ! -name "*.rlib" ! -name "*.d" | head -n 1)

          if [ -z "$ELF_FILE" ]; then
            ELF_FILE=$(find target/thumbv7em-none-eabihf/release/deps/ -type f ! -name "*.*" ! -name ".*" | head -n 1)
          fi

          if [ -z "$ELF_FILE" ]; then
            echo "Lỗi: Không tìm thấy file binary executable!" && exit 1
          fi

          echo "Đã tìm thấy file binary: $ELF_FILE"

          # 3. Chuyển đổi sang file UF2 (Family ID nRF52840: 0xada52840, Base Address: 0x26000)
          python3 uf2conv.py "$ELF_FILE" -c -b 0x26000 -f 0xada52840 -o dist/opensk_nrf52840_autoconfirm.uf2

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-nRF52840-Firmware-UF2
          path: dist/opensk_nrf52840_autoconfirm.uf2
