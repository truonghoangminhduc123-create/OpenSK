name: Build OpenSK UF2 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Toolchain & Download Converter
        run: |
          rustup target add thumbv7em-none-eabihf
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -O uf2conv.py
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -O uf2families.json

      - name: Setup OpenSK Environment
        run: |
          ./setup.sh

      - name: Build and Convert to UF2
        run: |
          mkdir -p dist
          
          # 1. Biên dịch dự án
          cargo build --release --target thumbv7em-none-eabihf

          # 2. Tìm file binary thực tế trong thư mục release (bỏ qua file .d, .rlib, .cargo-lock, v.v.)
          BIN_FILE=$(find target/thumbv7em-none-eabihf/release/ -maxdepth 1 -type f ! -name "*.*" ! -name ".*" | head -n 1)

          echo "File binary tìm thấy: $BIN_FILE"

          if [ -z "$BIN_FILE" ]; then
            echo "Không tìm thấy file binary!" && exit 1
          fi

          # 3. Chuyển đổi sang UF2
          python3 uf2conv.py "$BIN_FILE" -c -b 0x26000 -f 0xada52840 -o dist/opensk_nrf52840_autoconfirm.uf2

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-nRF52840-Firmware-UF2
          path: dist/opensk_nrf52840_autoconfirm.uf2
