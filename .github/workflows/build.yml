name: Build OpenSK UF2 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & uf2conv
        run: |
          rustup target add thumbv7em-none-eabihf
          python -m pip install --upgrade pip
          pip install uf2conv

      - name: Setup OpenSK Environment
        run: |
          ./setup.sh

      - name: Build and Convert to UF2
        run: |
          mkdir -p dist
          # 1. Chạy deploy script của OpenSK để biên dịch chuẩn target nRF52840
          python3 tools/deploy.py --board=nrf52840_mdk_usb_dongle --opensk --panic-help || true
          
          # 2. Tải công cụ chuyển đổi uf2conv
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py

          # 3. Quét tất cả file binary/hex tạo ra trong target và đóng gói thành 1 file .uf2 duy nhất
          BIN_FILE=$(find target/ -type f \( -name "*.hex" -o -name "*.bin" -o -name "opensk-wasefire" -o -name "opensk" \) | head -n 1)
          
          if [ -n "$BIN_FILE" ]; then
            python3 uf2conv.py "$BIN_FILE" -c -b 0x26000 -f 0xada52840 -o dist/opensk_nrf52840_autoconfirm.uf2
          else
            echo "Không tìm thấy file binary sau khi build!" && exit 1
          fi

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-nRF52840-Firmware-UF2
          path: dist/opensk_nrf52840_autoconfirm.uf2
