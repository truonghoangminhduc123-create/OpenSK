name: Build OpenSK nRF52840 SuperMini UF2

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OpenSK → nRF52840 → UF2
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: "1"
      # Ép môi trường UF2 về 0x1000
      UF2_BASE: "0x1000"
      UF2_FAMILY: "0xada52840"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            pkg-config libssl-dev libudev-dev python3 python3-pip curl git

      # ============================================================
      # RUST TOOLCHAIN
      # ============================================================
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ]; then cat rust-toolchain.toml; fi
          rustup show active-toolchain
          rustup target add thumbv7em-none-eabi

      - name: Verify Wasefire Rust toolchain
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ]; then cat rust-toolchain.toml; fi
          rustup show active-toolchain

      # ============================================================
      # WASEFIRE SETUP
      # ============================================================
      - name: Setup Wasefire
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail
          chmod +x scripts/setup.sh
          ./scripts/setup.sh -y

      # ============================================================
      # FORCE MEMORY OFFSET TO 0x1000 (PATCH LINKER SCRIPT)
      # Đây là bước "cưỡng chế" quan trọng nhất.
      # Nó tìm mọi file cấu hình bộ nhớ (.x) và đổi địa chỉ.
      # ============================================================
      - name: Force Memory Offset 0x1000
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail
          echo "=== Đang săn lùng và tiêu diệt 0x26000 ==="
          # Tìm mọi file .x (linker script) và thay thế 0x26000 / 0x00026000 thành 0x1000
          find . -type f -name "*.x" -exec sed -i 's/0x00026000/0x00001000/g' {} +
          find . -type f -name "*.x" -exec sed -i 's/0x26000/0x1000/g' {} +
          
          echo "=== Kiểm tra lại xem còn sót 0x26000 không ==="
          find . -type f -name "*.x" -exec grep -H "0x1000" {} + | head -n 20
          echo "=== Đã ép Offset về 0x1000 xong! ==="

      # ============================================================
      # BUILD FIRMWARE
      # ============================================================
      - name: Build OpenSK Wasefire firmware
        working-directory: third_party/wasefire
        shell: bash
        run: |
          set -euo pipefail

          XTASK_MANIFEST=""
          while IFS= read -r manifest; do
            if grep -q 'name *= *"xtask"' "$manifest" 2>/dev/null; then
              XTASK_MANIFEST="$manifest"
              break
            fi
          done < <(find . -type f -name Cargo.toml -print | sort)

          if [ -z "$XTASK_MANIFEST" ]; then
            echo "ERROR: Could not locate Wasefire xtask."
            exit 1
          fi

          XTASK_DIR="$(dirname "$XTASK_MANIFEST")"
          cargo build --manifest-path "$XTASK_MANIFEST" --release

          XTASK_BINARY=""
          if [ -x "$XTASK_DIR/target/release/xtask" ]; then
            XTASK_BINARY="$XTASK_DIR/target/release/xtask"
          elif [ -x "target/release/xtask" ]; then
            XTASK_BINARY="target/release/xtask"
          fi

          "$XTASK_BINARY" \
            --release \
            --native \
            applet rust ../.. \
            --opt-level=z \
            --features=ctap1,config-command \
            runner nordic \
              --board=makerdiary \
              --opt-level=z \
              --features=usb-ctap \
              --features=software-crypto-aes256-cbc \
              --features=software-crypto-hmac-sha256 \
              --features=software-crypto-p256-ecdh \
              --features=software-crypto-p256-ecdsa

      # ============================================================
      # FIND ELF & CONVERT
      # ============================================================
      - name: Locate final firmware ELF
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ELF_FILES < <(
            find . -type f \( -name runner-nordic -o -name '*.elf' \) -print 2>/dev/null | grep -E 'target|release' | sort -u
          )
          ELF=""
          for candidate in "${ELF_FILES[@]}"; do
            if [[ "$candidate" == *"runner-nordic"* ]]; then ELF="$candidate"; break; fi
          done
          if [ -z "$ELF" ] && [ ${#ELF_FILES[@]} -gt 0 ]; then ELF="${ELF_FILES[0]}"; fi
          if [ -z "$ELF" ]; then echo "ERROR: No ELF found."; exit 1; fi
          echo "OPENSK_ELF=$ELF" >> "$GITHUB_ENV"

      - name: Convert ELF to HEX and BIN
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-objcopy -O ihex "$OPENSK_ELF" artifacts/opensk_nrf52840.hex
          arm-none-eabi-objcopy -O binary --gap-fill 0xff "$OPENSK_ELF" artifacts/opensk_nrf52840.bin
          ls -lh artifacts/

      # ============================================================
      # PREPARE UF2 TOOLS
      # ============================================================
      - name: Prepare UF2 tools
        run: |
          set -euo pipefail
          cp -v tools/uf2/uf2conv.py .
          cp -v tools/uf2/uf2families.json .
          chmod +x uf2conv.py

      # ============================================================
      # CONVERT BIN TO UF2 (AT 0x1000)
      # ============================================================
      - name: Convert BIN to UF2 (Offset 0x1000)
        run: |
          set -euo pipefail
          test -f uf2families.json
          
          # Dùng biến môi trường UF2_BASE đã set ở trên (0x1000)
          python3 uf2conv.py \
            artifacts/opensk_nrf52840.bin \
            -c \
            -b ${{ env.UF2_BASE }} \
            -f ${{ env.UF2_FAMILY }} \
            -o artifacts/opensk_nrf52840_autoconfirm.uf2

          ls -lh artifacts/opensk_nrf52840_autoconfirm.uf2

      - name: Verify UF2
        run: |
          set -euo pipefail
          python3 uf2conv.py artifacts/opensk_nrf52840_autoconfirm.uf2 -i

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: opensk-nrf52840-supermini
          if-no-files-found: error
          path: |
            artifacts/opensk_nrf52840_autoconfirm.uf2
            artifacts/opensk_nrf52840.hex
            artifacts/opensk_nrf52840.bin
