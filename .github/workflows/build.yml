name: Build OpenSK UF2 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Toolchain & Dependencies
        run: |
          rustup target add thumbv7em-none-eabihf
          wget -q https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -O uf2conv.py

      - name: Setup OpenSK Environment
        run: |
          ./setup.sh

      - name: Build and Convert to UF2
        run: |
          mkdir -p dist
          
          # Biên dịch trực tiếp OpenSK target ARM Cortex-M4 (nRF52840)
          cargo build --release --target thumbv7em-none-eabihf

          # Tìm file ELF/binary tạo ra trong thư mục target release
          BIN_FILE=$(find target/thumbv7em-none-eabihf/release/ -maxdepth 1 -type f ! -name "*.d" ! -name "*.rlib" | head -n 1)

          if [ -n "$BIN_FILE" ]; then
            echo "Đã tìm thấy file binary: $BIN_FILE"
            # Chuyển đổi sang UF2 với Family ID nRF52840 (0xada52840) và Base Address 0x26000
            python3 uf2conv.py "$BIN_FILE" -c -b 0x26000 -f 0xada52840 -o dist/opensk_nrf52840_autoconfirm.uf2
          else
            echo "Không tìm thấy file binary trong target/" && exit 1
          fi

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-nRF52840-Firmware-UF2
          path: dist/opensk_nrf52840_autoconfirm.uf2
