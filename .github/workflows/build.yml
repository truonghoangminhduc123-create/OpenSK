name: Build OpenSK nRF52840 SuperMini UF2

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: OpenSK → nRF52840 → UF2
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: "1"
      UF2_BASE: "0x26000"
      UF2_FAMILY: "0xada52840"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            pkg-config \
            libssl-dev \
            libudev-dev \
            python3 \
            python3-pip \
            curl \
            git

      # ============================================================
      # VERIFY REPOSITORY
      # ============================================================

      - name: Verify repository
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "OpenSK"
          echo "=============================================="

          git rev-parse HEAD

          echo
          echo "=============================================="
          echo "Submodules"
          echo "=============================================="

          git submodule status

          echo
          echo "=============================================="
          echo "Wasefire"
          echo "=============================================="

          test -d third_party/wasefire

          echo "Wasefire submodule:"
          git submodule status third_party/wasefire

          echo
          echo "Wasefire files:"
          find third_party/wasefire \
            -maxdepth 2 \
            -type f \
            | head -100

      # ============================================================
      # RUST TOOLCHAIN
      #
      # IMPORTANT:
      # Let rustup read the repository's rust-toolchain files.
      #
      # OpenSK itself currently points to nightly-2026-06-03.
      # Wasefire has its own rust-toolchain.toml.
      # ============================================================

      - name: Install Rust toolchain
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "OpenSK Rust toolchain"
          echo "=============================================="

          if [ -f rust-toolchain.toml ]; then
            cat rust-toolchain.toml
          elif [ -f rust-toolchain ]; then
            cat rust-toolchain
          fi

          echo
          echo "=============================================="
          echo "Installing OpenSK toolchain"
          echo "=============================================="

          rustup show active-toolchain

          rustup target add thumbv7em-none-eabi

          echo
          rustc --version
          cargo --version

      # ============================================================
      # WASEFIRE TOOLCHAIN
      #
      # Entering third_party/wasefire makes rustup automatically
      # respect Wasefire's own rust-toolchain.toml.
      # ============================================================

      - name: Verify Wasefire Rust toolchain
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Wasefire rust-toolchain.toml"
          echo "=============================================="

          if [ -f rust-toolchain.toml ]; then
            cat rust-toolchain.toml
          elif [ -f rust-toolchain ]; then
            cat rust-toolchain
          fi

          echo
          echo "=============================================="
          echo "Active toolchain"
          echo "=============================================="

          rustup show active-toolchain
          rustc --version
          cargo --version

      # ============================================================
      # WASEFIRE SETUP
      # ============================================================

      - name: Setup Wasefire
        working-directory: third_party/wasefire
        run: |
          set -euo pipefail

          chmod +x scripts/setup.sh

          ./scripts/setup.sh -y

      # ============================================================
      # DISCOVER WASEFIRE WORKSPACE
      #
      # Do NOT assume:
      #
      # third_party/wasefire/Cargo.toml
      #
      # because the current Wasefire checkout does not have one
      # there.
      # ============================================================

      - name: Discover Wasefire Cargo projects
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Cargo.toml files inside Wasefire"
          echo "=============================================="

          find third_party/wasefire \
            -type f \
            -name Cargo.toml \
            -print \
            | sort \
            | head -200

          echo
          echo "=============================================="
          echo "Possible xtask crates"
          echo "=============================================="

          find third_party/wasefire \
            -type f \
            -name Cargo.toml \
            -print0 \
            | while IFS= read -r -d '' file; do
                if grep -q 'xtask' "$file" 2>/dev/null; then
                  echo "$file"
                fi
              done \
            | head -100

      # ============================================================
      # FIND WASEFIRE BUILD ENTRY POINT
      # ============================================================

      - name: Locate Wasefire build tools
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "xtask source files"
          echo "=============================================="

          find third_party/wasefire \
            -type f \
            \( \
              -name main.rs \
              -o -name xtask.rs \
            \) \
            -print \
            | grep -E 'xtask|crates' \
            | head -100 || true

          echo
          echo "=============================================="
          echo "runner-nordic files"
          echo "=============================================="

          find third_party/wasefire \
            -type f \
            | grep -E \
              'runner-nordic|nordic.*\.x$|memory\.x$' \
            | head -200 || true

      # ============================================================
      # BUILD OPEN SK
      #
      # IMPORTANT:
      #
      # We first try the repository's normal Wasefire build command.
      # If the exact xtask location differs, the diagnostic output
      # above tells us where it is.
      # ============================================================

      - name: Build OpenSK Wasefire firmware
        working-directory: third_party/wasefire
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Searching for Wasefire xtask"
          echo "=============================================="

          XTASK_MANIFEST=""

          while IFS= read -r manifest; do
            if grep -q 'name *= *"xtask"' "$manifest" 2>/dev/null; then
              XTASK_MANIFEST="$manifest"
              break
            fi
          done < <(
            find . \
              -type f \
              -name Cargo.toml \
              -print \
              | sort
          )

          if [ -z "$XTASK_MANIFEST" ]; then
            echo "ERROR: Could not locate Wasefire xtask."
            echo
            echo "Cargo manifests:"
            find . -type f -name Cargo.toml -print | sort
            exit 1
          fi

          echo "Found xtask:"
          echo "$XTASK_MANIFEST"

          XTASK_DIR="$(dirname "$XTASK_MANIFEST")"

          echo
          echo "xtask directory:"
          echo "$XTASK_DIR"

          echo
          echo "=============================================="
          echo "Building xtask"
          echo "=============================================="

          cargo build \
            --manifest-path "$XTASK_MANIFEST" \
            --release

          XTASK_BINARY=""

          if [ -x "$XTASK_DIR/target/release/xtask" ]; then
            XTASK_BINARY="$XTASK_DIR/target/release/xtask"
          elif [ -x "target/release/xtask" ]; then
            XTASK_BINARY="target/release/xtask"
          fi

          if [ -z "$XTASK_BINARY" ]; then
            echo "ERROR: xtask executable not found."

            find . \
              -type f \
              -name xtask \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "xtask binary:"
          echo "$XTASK_BINARY"

          echo
          echo "=============================================="
          echo "xtask help"
          echo "=============================================="

          "$XTASK_BINARY" --help || true

          echo
          echo "=============================================="
          echo "Building OpenSK"
          echo "=============================================="

          /*
           * The actual command below intentionally uses the
           * Wasefire xtask interface rather than cargo build.
           */

          "$XTASK_BINARY" \
            --release \
            --native \
            applet rust ../.. \
            --opt-level=z \
            --features=ctap1,config-command \
            runner nordic \
              --board=dongle \
              --single-sided \
              --opt-level=z \
              --features=usb-ctap \
              --features=software-crypto-aes256-cbc \
              --features=software-crypto-hmac-sha256 \
              --features=software-crypto-p256-ecdh \
              --features=software-crypto-p256-ecdsa

      # ============================================================
      # SEARCH FINAL ELF
      # ============================================================

      - name: Locate final firmware ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Searching for final ELF"
          echo "=============================================="

          mapfile -t ELF_FILES < <(
            find . \
              -type f \
              \( \
                -name runner-nordic \
                -o -name runner-nordic.elf \
                -o -name '*.elf' \
              \) \
              -print \
              2>/dev/null \
              | grep -E \
                'target|release' \
              | sort -u
          )

          if [ "${#ELF_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ELF found."

            echo
            echo "All runner files:"
            find . \
              -type f \
              -iname '*runner*' \
              -print \
              2>/dev/null \
              | head -300

            echo
            echo "All executable files:"
            find . \
              -type f \
              -perm -111 \
              -print \
              2>/dev/null \
              | head -300

            exit 1
          fi

          echo "ELF candidates:"
          printf '%s\n' "${ELF_FILES[@]}"

          ELF=""

          for candidate in "${ELF_FILES[@]}"; do
            if [[ "$candidate" == *"runner-nordic" ]]; then
              ELF="$candidate"
              break
            fi
          done

          if [ -z "$ELF" ]; then
            ELF="${ELF_FILES[0]}"
          fi

          echo
          echo "FINAL ELF:"
          echo "$ELF"

          echo "OPENSK_ELF=$ELF" >> "$GITHUB_ENV"

      # ============================================================
      # VALIDATE ELF
      # ============================================================

      - name: Validate ELF
        run: |
          set -euo pipefail

          file "$OPENSK_ELF"

          echo
          arm-none-eabi-readelf \
            -h \
            "$OPENSK_ELF"

          echo
          arm-none-eabi-readelf \
            -S \
            "$OPENSK_ELF"

          echo
          arm-none-eabi-readelf \
            -l \
            "$OPENSK_ELF"

      # ============================================================
      # ELF → HEX
      # ============================================================

      - name: Convert ELF to HEX
        run: |
          set -euo pipefail

          mkdir -p artifacts

          arm-none-eabi-objcopy \
            -O ihex \
            "$OPENSK_ELF" \
            artifacts/opensk_nrf52840.hex

      # ============================================================
      # ELF → BIN
      # ============================================================

      - name: Convert ELF to BIN
        run: |
          set -euo pipefail

          arm-none-eabi-objcopy \
            -O binary \
            --gap-fill 0xff \
            "$OPENSK_ELF" \
            artifacts/opensk_nrf52840.bin

          ls -lh artifacts/

      # ============================================================
      # UF2CONV
      # ============================================================

      - name: Download uf2conv.py
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py \
            -o uf2conv.py

          chmod +x uf2conv.py

      # ============================================================
      # BIN → UF2
      # ============================================================

      - name: Convert BIN to UF2
        run: |
          set -euo pipefail

          python3 uf2conv.py \
            artifacts/opensk_nrf52840.bin \
            -c \
            -b 0x26000 \
            -f 0xada52840 \
            -o artifacts/opensk_nrf52840_autoconfirm.uf2

          test -s \
            artifacts/opensk_nrf52840_autoconfirm.uf2

          echo
          echo "UF2 created:"
          ls -lh \
            artifacts/opensk_nrf52840_autoconfirm.uf2

      # ============================================================
      # VERIFY UF2
      # ============================================================

      - name: Verify UF2
        run: |
          set -euo pipefail

          python3 uf2conv.py \
            artifacts/opensk_nrf52840_autoconfirm.uf2 \
            -i

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: opensk-nrf52840-supermini
          if-no-files-found: error
          path: |
            artifacts/opensk_nrf52840_autoconfirm.uf2
            artifacts/opensk_nrf52840.hex
            artifacts/opensk_nrf52840.bin
