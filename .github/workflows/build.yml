name: Build OpenSK nRF52840 SuperMini UF2

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.rs"
      - "**/*.toml"
      - "**/*.x"
      - "setup.sh"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OpenSK -> nRF52840 UF2
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: "1"
      UF2_FAMILY: "0xada52840"
      UF2_BASE: "0x26000"

    steps:
      # ------------------------------------------------------------
      # 1. Checkout OpenSK + Wasefire submodules
      # ------------------------------------------------------------
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Install native dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            pkg-config \
            libssl-dev \
            libudev-dev \
            python3 \
            python3-pip

      # ------------------------------------------------------------
      # 3. Install the exact Wasefire Rust toolchain
      #
      # Wasefire currently pins:
      # nightly-2026-08-04
      # thumbv7em-none-eabi
      # ------------------------------------------------------------
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-08-04 \
            --profile minimal \
            --component rust-src \
            --component llvm-tools \
            --component rustfmt \
            --target thumbv7em-none-eabi

          rustup default nightly-2026-08-04

          rustup target list --installed

      # ------------------------------------------------------------
      # 4. Verify repository/submodule state
      # ------------------------------------------------------------
      - name: Verify OpenSK and Wasefire
        run: |
          test -d third_party/wasefire
          test -f third_party/wasefire/Cargo.toml

          echo "OpenSK:"
          git rev-parse HEAD

          echo
          echo "Wasefire:"
          git -C third_party/wasefire rev-parse HEAD

      # ------------------------------------------------------------
      # 5. Install Wasefire's own dependencies
      # ------------------------------------------------------------
      - name: Setup Wasefire
        working-directory: third_party/wasefire
        run: |
          ./scripts/setup.sh -y

      # ------------------------------------------------------------
      # 6. IMPORTANT:
      #
      # OpenSK's applet is NOT itself an executable.
      #
      # cargo build --release ... only gives:
      #
      #   libopensk_wasefire.rlib
      #
      # We therefore build:
      #
      #   OpenSK applet
      #        ↓
      #   Wasefire runner-nordic
      #        ↓
      #   final ELF
      #
      # Also patch the Nordic linker layout so the generated
      # firmware starts at 0x26000, which is the application
      # address expected by the Adafruit UF2 bootloader.
      # ------------------------------------------------------------
      - name: Configure Adafruit UF2 memory layout
        working-directory: third_party/wasefire
        run: |
          cp crates/runner-nordic/board-dongle.x \
             crates/runner-nordic/board-dongle.x.original

          cat > crates/runner-nordic/board-dongle.x <<'EOF'
          /* nRF52840 Adafruit UF2 / SuperMini layout
           *
           * Application starts at 0x26000.
           *
           * We use Wasefire single-sided mode, so only one
           * platform side is allocated.
           *
           * Flash:
           *
           *   0x00000 - 0x25FFF : SoftDevice / bootloader
           *   0x26000 - 0x97FFF : Wasefire platform
           *   0x98000 - 0xD9FFF : OpenSK applet
           *   0xDA000 - 0xECFFF : Wasefire storage
           *   0xED000 - 0xFFFFF : bootloader / reserved
           *
           * The exact usable application/storage sizes are
           * constrained by the Adafruit nRF52840 UF2 layout.
           */

          /* RAM */
          _rstack = 0x20000008;
          _rheap  = 0x20008000;
          _rlimit = 0x20040000;

          /* FLASH */
          _platform = 0x00026000;
          _applet   = 0x00098000;
          _store    = 0x000DA000;
          _limit    = 0x000ED000;
          EOF

          echo "=== Patched linker script ==="
          cat crates/runner-nordic/board-dongle.x

      # ------------------------------------------------------------
      # 7. Build the ACTUAL OpenSK firmware.
      #
      # This is intentionally NOT:
      #
      # cargo build --release --target thumbv7em-none-eabihf
      #
      # Instead Wasefire xtask:
      #
      #   1. builds OpenSK as native applet
      #   2. links it into runner-nordic
      #   3. produces runner-nordic ELF
      # ------------------------------------------------------------
      - name: Build OpenSK Wasefire Nordic firmware
        working-directory: third_party/wasefire
        run: |
          cargo xtask \
            --release \
            --native \
            applet rust ../.. \
            --opt-level=z \
            --features=ctap1,config-command \
            runner nordic \
              --board=dongle \
              --single-sided \
              --opt-level=z \
              --features=usb-ctap \
              --features=software-crypto-aes256-cbc \
              --features=software-crypto-hmac-sha256 \
              --features=software-crypto-p256-ecdh \
              --features=software-crypto-p256-ecdsa

      # ------------------------------------------------------------
      # 8. Find the FINAL ELF.
      #
      # Wasefire's xtask normally places it here:
      #
      # third_party/wasefire/
      #   target/thumbv7em-none-eabi/release/runner-nordic
      #
      # But don't hard-code that assumption.
      # Search both common target roots.
      # ------------------------------------------------------------
      - name: Locate final ELF
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Wasefire Nordic ELF..."

          mapfile -t ELF_FILES < <(
            find \
              third_party/wasefire/target \
              target \
              -type f \
              \( \
                -name 'runner-nordic' \
                -o -name 'runner-nordic.elf' \
              \) \
              -print 2>/dev/null | sort -u
          )

          if [ "${#ELF_FILES[@]}" -eq 0 ]; then
            echo
            echo "ERROR: runner-nordic ELF was not found."
            echo
            echo "Possible build outputs:"
            find third_party/wasefire/target target \
              -type f \
              \( -name '*.elf' -o -name 'runner-*' \) \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Candidates:"
          printf '  %s\n' "${ELF_FILES[@]}"

          # Prefer the release ARM ELF generated by Wasefire.
          ELF=""

          for candidate in "${ELF_FILES[@]}"; do
            if [[ "$candidate" == *"/thumbv7em-none-eabi/release/runner-nordic" ]]; then
              ELF="$candidate"
              break
            fi
          done

          if [ -z "$ELF" ]; then
            ELF="${ELF_FILES[0]}"
          fi

          echo
          echo "Selected ELF:"
          echo "$ELF"

          test -f "$ELF"

          echo "OPENSK_ELF=$ELF" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 9. Validate the ELF.
      #
      # We specifically require:
      #
      #   ARM
      #   Cortex-M / Thumb
      #   nRF52840 firmware layout beginning around 0x26000
      # ------------------------------------------------------------
      - name: Validate ELF
        run: |
          set -euo pipefail

          echo "=== ELF header ==="
          arm-none-eabi-readelf -h "$OPENSK_ELF"

          echo
          echo "=== ELF sections ==="
          arm-none-eabi-readelf -S "$OPENSK_ELF"

          echo
          echo "=== ELF program headers ==="
          arm-none-eabi-readelf -l "$OPENSK_ELF"

          echo
          echo "=== ELF architecture check ==="

          arm-none-eabi-readelf -h "$OPENSK_ELF" \
            | grep -E \
              'Class:|Data:|Machine:|Entry point address:'

      # ------------------------------------------------------------
      # 10. Convert ELF -> HEX and BIN.
      #
      # HEX preserves the actual linked flash addresses.
      #
      # BIN is used for uf2conv.py because that lets us explicitly
      # pass:
      #
      #   -b 0x26000
      #   -f 0xada52840
      # ------------------------------------------------------------
      - name: Convert ELF to HEX and BIN
        run: |
          set -euo pipefail

          mkdir -p artifacts

          arm-none-eabi-objcopy \
            -O ihex \
            "$OPENSK_ELF" \
            artifacts/opensk_nrf52840.hex

          arm-none-eabi-objcopy \
            -O binary \
            --gap-fill 0xff \
            "$OPENSK_ELF" \
            artifacts/opensk_nrf52840.bin

          echo "Generated files:"
          ls -lh artifacts/

      # ------------------------------------------------------------
      # 11. Download official uf2conv.py
      # ------------------------------------------------------------
      - name: Get uf2conv.py
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py \
            -o uf2conv.py

          chmod +x uf2conv.py

          python3 uf2conv.py --help

      # ------------------------------------------------------------
      # 12. BIN -> UF2
      #
      # EXACT requested parameters:
      #
      #   -b 0x26000
      #   -f 0xada52840
      #
      # -c = convert only, don't try to flash a USB drive.
      # ------------------------------------------------------------
      - name: Convert firmware to UF2
        run: |
          set -euo pipefail

          python3 uf2conv.py \
            artifacts/opensk_nrf52840.bin \
            -c \
            -b "$UF2_BASE" \
            -f "$UF2_FAMILY" \
            -o artifacts/opensk_nrf52840_autoconfirm.uf2

          test -s artifacts/opensk_nrf52840_autoconfirm.uf2

          echo
          echo "=== UF2 info ==="

          python3 uf2conv.py \
            artifacts/opensk_nrf52840_autoconfirm.uf2 \
            -i

          echo
          echo "=== Final artifacts ==="
          ls -lh artifacts/

      # ------------------------------------------------------------
      # 13. Upload all useful build outputs.
      # ------------------------------------------------------------
      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensk-nrf52840-supermini
          if-no-files-found: error
          path: |
            artifacts/opensk_nrf52840_autoconfirm.uf2
            artifacts/opensk_nrf52840.hex
            artifacts/opensk_nrf52840.bin
